name: Deploy Laravel to VPS Muse (nabela-payroll.web.id)

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-laravel-nabela-vps
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (Validate, Lint, Test, Build, Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, sqlite3, curl, xml, zip, gd, fileinfo, openssl, ctype, json, tokenizer, dom
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Secret Scan (Gitleaks)
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --redact -v

      - name: PHP Syntax Check & Config Parse Validation
        run: |
          find app bootstrap config database routes public -type f -name "*.php" -print0 | xargs -0 -n1 php -l
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan config:clear

      - name: Run Automated Tests (PHPUnit)
        run: php artisan test

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Frontend Assets (Vite)
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

  deploy-vps:
    name: Deploy to VPS Muse via Cloudflared Tunnel
    needs: quality-gate
    if: github.ref == 'refs/heads/production' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, curl, xml, zip, fileinfo, openssl, ctype, json, tokenizer, dom
          tools: composer:v2
          coverage: none

      - name: Install Production Composer Dependencies (--no-dev)
        run: |
          rm -f .env
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-scripts
          rm -f bootstrap/cache/*.php

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Frontend Assets (Vite)
        run: |
          npm ci
          npm run build
          test -f public/build/manifest.json

      - name: Create Deployment Tarball
        run: |
          rm -f .env .env.*
          rm -f bootstrap/cache/*.php
          tar -czf /tmp/deploy.tar.gz \
            --exclude='./.git*' \
            --exclude='./.env*' \
            --exclude='./tests*' \
            --exclude='./docs*' \
            --exclude='./dokumen*' \
            --exclude='./*.md' \
            --exclude='./.github*' \
            --exclude='./node_modules*' \
            --exclude='./Zzz*' \
            --exclude='./storage/*' \
            .
          ls -lh /tmp/deploy.tar.gz
          tar -tzf /tmp/deploy.tar.gz | grep -q "vendor/autoload.php"
          tar -tzf /tmp/deploy.tar.gz | grep -q "public/build/manifest.json"
          if tar -tzf /tmp/deploy.tar.gz | grep -E '(^|\./)\.env'; then
            echo "FATAL: File .env tidak boleh masuk ke dalam tarball!"
            exit 1
          fi

      - name: Install cloudflared & Configure SSH Tunnel
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_USERNAME" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "FATAL: Empat secret wajib (SSH_HOST, SSH_PORT, SSH_USERNAME, SSH_PRIVATE_KEY) harus terisi."
            exit 1
          fi
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat <<EOF > ~/.ssh/config
          Host vps
            HostName ${SSH_HOST}
            Port ${SSH_PORT}
            User ${SSH_USERNAME}
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand cloudflared access ssh --hostname %h
          EOF
          chmod 600 ~/.ssh/config

      - name: Transfer Tarball to VPS via Tunnel
        run: |
          ssh vps "mkdir -p /home/hatch/workspace/nabela-payroll.web.id"
          scp /tmp/deploy.tar.gz vps:/tmp/deploy-nabela-payroll.tar.gz

      - name: Extract, Configure Cache, Storage Link, & Verify Health on VPS
        run: |
          ssh vps bash -s <<'EOF'
          set -e
          APP_DIR="/home/hatch/workspace/nabela-payroll.web.id"
          cd "$APP_DIR"

          if [ ! -f "$APP_DIR/.env" ]; then
            echo "FATAL: File .env belum ada di $APP_DIR/.env! Buat manual di server (mode 600, owner rzkymuse666) sebelum deploy."
            rm -f /tmp/deploy-nabela-payroll.tar.gz
            exit 1
          fi

          tar -xzf /tmp/deploy-nabela-payroll.tar.gz -C "$APP_DIR"
          rm -f /tmp/deploy-nabela-payroll.tar.gz

          mkdir -p \
            storage/app/private \
            storage/app/public \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/testing \
            storage/framework/views \
            storage/logs \
            bootstrap/cache

          chmod -R 775 storage bootstrap/cache

          rm -f bootstrap/cache/*.php
          php artisan package:discover --ansi || true

          if ! (php artisan config:cache && php artisan route:cache && php artisan view:cache); then
            echo "WARN: Salah satu proses cache gagal, menjalankan php artisan config:clear sebagai fallback..."
            php artisan config:clear || true
          fi

          php artisan storage:link --force || php artisan storage:link || true

          echo "Memeriksa endpoint /health..."
          if curl -fsS -H "Host: nabela-payroll.web.id" http://127.0.0.1/health || curl -fsS http://127.0.0.1/health; then
            echo ""
            echo "Health check HTTP /health berhasil (200 OK)."
          else
            echo "WARN: curl ke http://127.0.0.1/health belum mengembalikan 200 (pool FPM / blok nginx mungkin belum aktif). Memverifikasi sintaks & tabel route..."
            php -l public/index.php
            ROUTE_OUT=$(php artisan route:list --path=health)
            echo "$ROUTE_OUT"
            echo "$ROUTE_OUT" | grep -q "health" || {
              echo "FATAL: Route /health tidak terdaftar di aplikasi!"
              exit 1
            }
          fi
          EOF
